# ==============================================================================
# Google Cloud Build Pipeline
# Compatible with both manual "gcloud builds submit" and automated Git triggers
# ==============================================================================
steps:
  # ----------------------------------------------------------------------------
  # Step 1: Python Syntax & Compilation Verification
  # ----------------------------------------------------------------------------
  - name: 'python:3.12-alpine3.20'
    id: 'test'
    entrypoint: 'python3'
    args: ['-m', 'py_compile', 'app.py']

  # ----------------------------------------------------------------------------
  # Step 2: Build Container Image with Dynamic Injected Metadata
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '--build-arg'
      - 'COMMIT_SHA=$_COMMIT_SHA'
      - '--build-arg'
      - 'BUILD_TIME=$_BUILD_TIMESTAMP'
      - '--build-arg'
      - 'VERSION=$_APP_VERSION'
      - '--build-arg'
      - 'APP_ENV=$_ENV_NAME'
      - '-t'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:$_SHORT_SHA'
      - '-t'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:latest'
      - '.'

  # ----------------------------------------------------------------------------
  # Step 3: Push Images to GCP Artifact Registry
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args:
      - 'push'
      - '--all-tags'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME'

  # ----------------------------------------------------------------------------
  # Step 4: Deploy Revision to Google Cloud Run
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image=$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:$_SHORT_SHA'
      - '--region=$_LOCATION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--service-account=$_RUNTIME_SA_EMAIL'

# ------------------------------------------------------------------------------
# Default Substitution Values (Overridden dynamically during build)
# ------------------------------------------------------------------------------
substitutions:
  _LOCATION: 'us-central1'
  _REPO_NAME: 'build-info-repo'
  _SERVICE_NAME: 'build-info-api'
  _APP_VERSION: 'v1.0.0'
  _ENV_NAME: 'production'
  _SHORT_SHA: 'manual'
  _COMMIT_SHA: 'manual-build'
  _BUILD_TIMESTAMP: '2026-09-12T00:00:00Z'
  _RUNTIME_SA_EMAIL: 'sa-build-info-runner@$PROJECT_ID.iam.gserviceaccount.com'

images:
  - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:$_SHORT_SHA'
  - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:latest'

options:
  logging: CLOUD_LOGGING_ONLY