# ==============================================================================
# File: cloudbuild.yaml
# Purpose: Bank-grade CI/CD pipeline definition for build-info microservice
# ==============================================================================

steps:
  # ----------------------------------------------------------------------------
  # Step 1: Bake Immutable Build Metadata (The "Birth Certificate")
  # Captures real Git SHA, UTC timestamp, environment, and release message
  # ----------------------------------------------------------------------------
  - name: 'ubuntu'
    id: 'bake-metadata'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ -f VERSION ]; then
          DEPLOYED_VERSION=$(cat VERSION | tr -d '\r\n')
        else
          DEPLOYED_VERSION="${_APP_VERSION}"
        fi

        echo "Baking build metadata into immutable build_info.json..."
        cat <<EOF > build_info.json
        {
          "application": "${_SERVICE_NAME}",
          "version": "$${DEPLOYED_VERSION}",
          "git_commit": "${COMMIT_SHA}",
          "build_time": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
          "environment": "${_ENV_NAME}",
          "release_message": "${_RELEASE_MESSAGE}"
        }
        EOF

        echo "Baked metadata contents:"
        cat build_info.json

  # ----------------------------------------------------------------------------
  # Step 2: Build the Hardened Docker Container
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - '${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '-t'
      - '${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest'
      - '.'

  # ----------------------------------------------------------------------------
  # Step 3: Push Image to Google Artifact Registry
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-latest'
    args:
      - 'push'
      - '${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest'

  # ----------------------------------------------------------------------------
  # Step 4: Deploy Container Revision to Google Cloud Run
  # ----------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '--region=${_LOCATION}'
      - '--service-account=${_RUNTIME_SA_EMAIL}'

# Default substitutions (used if not explicitly supplied)
substitutions:
  _LOCATION: 'us-central1'
  _REPO_NAME: 'build-info-repo'
  _SERVICE_NAME: 'build-info-api'
  _APP_VERSION: 'v1.1.0'
  _ENV_NAME: 'production'
  _RELEASE_MESSAGE: 'Release 1.1.0: Real-time fraud detection engine enabled'
  _RUNTIME_SA_EMAIL: 'sa-build-info-runner@moz-poc.iam.gserviceaccount.com'

images:
  - '${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}'
  - '${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest'

options:
  logging: CLOUD_LOGGING_ONLY